[project]
name = "ib15"
version = "0.1.0"
description = "OMIE day-ahead price dataset for the Iberian 15-minute battery arbitrage paper"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=17",
    "scipy>=1.18.1",
    "tzdata>=2024.1",
]

[project.scripts]
ib15 = "ib15.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
